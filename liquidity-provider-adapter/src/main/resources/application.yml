server:
  port: 8084

spring:
  application:
    name: liquidity-provider-adapter

resilience4j:
  circuitbreaker:
    instances:
      externalLiquidityProvider:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      externalLiquidityProvider:
        max-attempts: 3
        wait-duration: 200ms
  timelimiter:
    instances:
      externalLiquidityProvider:
        timeout-duration: 2s

# The "external LP" this adapter talks to is a self-contained mock (see mock/) that injects
# random latency and failures — standing in for a real exchange/LP API for demo purposes.
mock-lp:
  failure-rate: 0.3
  min-latency-ms: 50
  max-latency-ms: 400
