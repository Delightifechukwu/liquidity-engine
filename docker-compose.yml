version: "3.8"

# Local dev/demo stack. Not a production Kubernetes manifest — the JD's cloud/K8s requirement
# is demonstrated via the AWS/EKS work on the resume, not this repo; this compose file's job
# is "clone, docker compose up, place an order" in under two minutes.

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: liquidity_engine
      POSTGRES_USER: liquidity
      POSTGRES_PASSWORD: liquidity
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    depends_on:
      - kafka
      - postgres
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/liquidity_engine
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  matching-engine:
    build:
      context: .
      dockerfile: matching-engine/Dockerfile
    depends_on:
      - kafka
    ports:
      - "8082:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  execution-settlement:
    build:
      context: .
      dockerfile: execution-settlement/Dockerfile
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/liquidity_engine
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  liquidity-provider-adapter:
    build:
      context: .
      dockerfile: liquidity-provider-adapter/Dockerfile
    ports:
      - "8084:8084"

  risk-service:
    build:
      context: .
      dockerfile: risk-service/Dockerfile
    ports:
      - "8085:8085"

  market-data-service:
    build:
      context: .
      dockerfile: market-data-service/Dockerfile
    depends_on:
      - kafka
    ports:
      - "8086:8086"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  reconciliation-job:
    build:
      context: .
      dockerfile: reconciliation-job/Dockerfile
    depends_on:
      - postgres
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/liquidity_engine

volumes:
  postgres-data:
