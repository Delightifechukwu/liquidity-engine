services:

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-kraft-data:/var/lib/kafka/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: liquidity_engine
      POSTGRES_USER: liquidity
      POSTGRES_PASSWORD: liquidity
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liquidity -d order_service -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d

  # Issues real, validly-signed JWTs for local/demo use so order-service's OAuth2 resource
  # server wiring can be exercised end-to-end without standing up a full Keycloak instance.
  # Not used or shipped in production.
  oauth:
    image: ghcr.io/navikt/mock-oauth2-server@sha256:b538810afd589d42fbfb856c588c2065eaeed1dc528d6c532972048e67fc2aff
    environment:
      SERVER_PORT: 8080
      JSON_CONFIG_PATH: /config/demo.json
    volumes:
      - ./docker/oauth-demo.json:/config/demo.json:ro

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
      oauth:
        condition: service_started
    ports:
      - "127.0.0.1:${ORDER_HOST_PORT:-8081}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_service
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LP_BASE_URL: http://liquidity-provider-adapter:8084
      OAUTH_ISSUER_URI: http://oauth:8080/liquidity-engine

  matching-engine:
    profiles: [legacy]
    build:
      context: .
      dockerfile: matching-engine/Dockerfile
    depends_on:
      - kafka
    ports:
      - "8082:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  execution-settlement:
    profiles: [legacy]
    build:
      context: .
      dockerfile: execution-settlement/Dockerfile
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/liquidity_engine
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  liquidity-provider-adapter:
    build:
      context: .
      dockerfile: liquidity-provider-adapter/Dockerfile
    environment:
      MOCK_LP_FAILURE_RATE: ${MOCK_LP_FAILURE_RATE:-0}
    ports:
      - "127.0.0.1:${PROVIDER_HOST_PORT:-8084}:8084"

  risk-service:
    profiles: [legacy]
    build:
      context: .
      dockerfile: risk-service/Dockerfile
    ports:
      - "8085:8085"

  market-data-service:
    build:
      context: .
      dockerfile: market-data-service/Dockerfile
    depends_on:
      - kafka
    ports:
      - "127.0.0.1:${MARKET_DATA_HOST_PORT:-8086}:8086"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  reconciliation-job:
    profiles: [legacy]
    build:
      context: .
      dockerfile: reconciliation-job/Dockerfile
    depends_on:
      - postgres
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/liquidity_engine

volumes:
  kafka-kraft-data:
  postgres-data:
